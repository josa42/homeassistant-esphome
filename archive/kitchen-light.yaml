substitutions:
  device_name: "kitchen_shelly"

esphome:
  name: ${device_name}
  friendly_name: "Küchenlicht"
  area: Küche

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "h3MtmW6onK1T6SkMXL1Nj9XCnkFItK92GgGZR3JRgDo="

ota:
  - platform: esphome
    password: "1487f9fc8b2a6b3bd983527d908572c6"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Kitchen-Light Fallback Hotspot"
    password: "kMZmLFQJZrkv"

captive_portal:

web_server:

# Device Specific Config
output:
  - platform: gpio
    pin: GPIO4
    id: shelly_1_relay

light:
  - platform: binary
    name: kitchen_light
    output: shelly_1_relay
    id: kitchen_light


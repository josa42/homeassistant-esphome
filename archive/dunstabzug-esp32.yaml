          condition:
            lambda: 'return !id(select_sync_in_progress);'
          then:
            - globals.set:
                id: vent_sync_in_progress
                value: 'true'
            - if:
                condition:
                  lambda: |-
                    int select_val = std::stoi(id(select_level).current_option());
                    int vent_val = static_cast<int>(id(vent_level).state);
                    return select_val != vent_val;
                then:
                  - lambda: |-
                      int current = static_cast<int>(id(vent_level).state);

                      auto call = id(select_level).make_call();
                      call.set_option(std::to_string(current).c_str());
                      call.perform();
                  - logger.log:
                      format: "Select synced: %d → %d"
                      args: [ 'std::stoi(id(select_level).current_option())', 'static_cast<int>(id(vent_level).state)' ]

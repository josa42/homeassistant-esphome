globals:
  - id: sync_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: vent_sync_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: select_sync_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

remote_transmitter:
  pin: GPIO4 #  -> D2
  # RF uses a 100% carrier signal
  carrier_duty_percent: 100%

# remote_receiver:
#   pin: D2
#   dump:
#     - rc_switch

# Script: Sendet RF-Code (mit Parameter)
script:
  - id: send_up
    then:
      - script.execute:
          id: send_command
          name: Up
          code: '010101010101'
      - delay: 100ms

  - id: send_down
    then:
      - script.execute:
          id: send_command
          name: Down
          code: '010101010110'
      - delay: 100ms

  - id: send_command
    parameters:
      name: string
      code: string
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: !lambda 'return code;'
          protocol:
            pulse_length: 320
            sync: [36, 1]
            zero: [1, 2]
            one: [2, 1]
            inverted: True
          repeat:
            times: 2
            wait_time: 10ms
      - logger.log:
          format: "Sent code %s"
          args: ['name.c_str()']



select:
  - platform: template
    name: "Ziel Stufe"
    id: select_level
    options:
      - "0"
      - "1" 
      - "2"
      - "3"
      - "4"
    initial_option: "0"
    optimistic: true
    restore_value: NO
    on_value:
      - if:
          condition:
            lambda: 'return id(boot_complete) && !id(vent_sync_in_progress);'
          then:
            - globals.set:
                id: select_sync_in_progress
                value: 'true'
            - repeat:
                count: 3
                then:
                  - if:
                      condition:
                        lambda: |-
                          return std::stoi(id(select_level).current_option()) != id(vent_level).state;
                      then:
                        - if:
                            condition:
                              lambda: |-
                                return std::stoi(id(select_level).current_option()) > id(vent_level).state;
                            then:
                              - script.execute:
                                  id: send_up
                            else:
                              - script.execute:
                                  id: send_down
                        - delay: 4s

            - globals.set:
                id: select_sync_in_progress
                value: 'false'



#############################################

sensor:
  - platform: adc
    pin: GPIO36 # -> VP
    id: adc_sensor
    update_interval: 1s

  - platform: ct_clamp
    sensor: adc_sensor
    id: strom_sensor
    # internal: true
    name: "Strom"
    unit_of_measurement: "A"
    accuracy_decimals: 5
    update_interval: 1s
    sample_duration: 400ms

  - platform: template
    name: "Stufe"
    id: vent_level
    unit_of_measurement: ""
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      float strom = id(strom_sensor).state;
      if (std::isnan(strom) || strom < 0.0005) return 0;
      else if (strom < 0.0015) return 1;
      else if (strom < 0.0025) return 2;
      else if (strom < 0.0045) return 3;
      else return 4;


esphome:
  name: dunstabzug
  friendly_name: Dunstabzug
  on_boot:
    priority: -100  # Nach Sensor-Initialisierung
    then:
      - script.execute: { id: sync_led }

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # type: arduino

web_server:
  port: 80

# Enable logging
logger:
  level: DEBUG
  logs:
    sensor: WARN
    adc: WARN

# Enable Home Assistant API
api:
  encryption:
    key: "4GsaecXW2klfcOr/galAgpEdLLOFnav5iUnww08zNos="

ota:
  - platform: esphome
    password: "158298a007ac05eabf699ebdd7dd8a71"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dunstabzug Fallback Hotspot"
    password: "nU4fknvMUP8w"

captive_portal:

globals:
  - id: syncing_from_sensor
    type: bool
    initial_value: 'true'

  # Zustand, den das Licht haben soll. Neue Befehle überschreiben ihn, solange
  # apply_light noch auf die Lampe wartet ("latest wins").
  - id: light_target
    type: bool
    initial_value: 'false'

  # true, solange apply_light die Lampe schaltet
  - id: light_busy
    type: bool
    initial_value: 'false'

  # Zustand, den led_status nach dem laufenden Toggle melden soll
  - id: light_expected
    type: bool
    initial_value: 'false'

  - id: light_attempts
    type: int
    initial_value: '0'

####################################################################################################

remote_transmitter:
  pin: GPIO4
  # RF uses a 100% carrier signal
  carrier_duty_percent: 100%

####################################################################################################
# Internal sensors

sensor:
  - platform: adc
    pin:
      number: 34
    attenuation: 11db
    update_interval: 100ms
    accuracy_decimals: 1
    filters:
      - multiply: 5.0  # Kalibriere später
      # Einzelne Ausreißer verwerfen (verursachten 1s an/aus Ghost-Events)
      - median:
          window_size: 5
          send_every: 1
    unit_of_measurement: V
    id: voltage_light

binary_sensor:
  - platform: template
    id: led_status
    lambda: |-
      return id(voltage_light).state > 1;
    filters:
      - delayed_on_off: 500ms
    on_state:
      then:
        - script.execute: { id: sync_led }

####################################################################################################

# Script: Sendet RF-Code (mit Parameter)

script:
  - id: send_up
    then:
      - script.execute:
          id: send_command
          code: '010101010101'
      - logger.log:
          format: "Sent code 'up'"
      - delay: 100ms

  - id: send_down
    then:
      - script.execute:
          id: send_command
          code: '010101010110'
      - logger.log:
          format: "Sent code 'down'"
      - delay: 100ms

  - id: send_light
    then:
      - script.execute:
          id: send_command
          code: '010101010111010001'
      - logger.log:
          format: "Sent code 'light'"
      - delay: 100ms

  - id: send_command
    parameters:
      code: string
    then:
      - remote_transmitter.transmit_rc_switch_raw:
          code: !lambda 'return code;'
          protocol:
            pulse_length: 320
            sync: [36, 1]
            zero: [1, 2]
            one: [2, 1]
            inverted: True
          repeat:
            times: 2
            wait_time: 10ms
  # Schaltet per Toggle-Code, bis die Lampe light_target erreicht hat. Die Lampe
  # blendet ein/aus, daher wird nach jedem Toggle gewartet, bis led_status den
  # neuen Zustand meldet, bevor erneut verglichen wird.
  - id: apply_light
    mode: single
    then:
      - globals.set:
          id: light_busy
          value: 'true'
      - globals.set:
          id: light_attempts
          value: '0'
      - while:
          condition:
            lambda: 'return id(led_status).state != id(light_target) && id(light_attempts) < 3;'
          then:
            - lambda: |-
                id(light_attempts) += 1;
                id(light_expected) = !id(led_status).state;
            - script.execute: { id: send_light }
            - script.wait: send_light
            - wait_until:
                condition:
                  lambda: 'return id(led_status).state == id(light_expected);'
                timeout: 5s
            # Lampe zu Ende blenden lassen, bevor erneut getoggelt wird
            - delay: 1s
      - if:
          condition:
            lambda: 'return id(led_status).state != id(light_target);'
          then:
            - logger.log:
                level: WARN
                format: "Light did not reach target state"
      - globals.set:
          id: light_busy
          value: 'false'
      # Tatsächlichen Zustand übernehmen (auch nach Fehlschlag)
      - script.execute: { id: sync_led }

  - id: sync_led
    mode: restart
    then:
      # Während apply_light läuft, zeigt das Licht den Zielzustand; Zwischenstände
      # der Lampe (Einblenden) nicht übernehmen. apply_light ruft sync_led am Ende auf.
      - if:
          condition:
            lambda: 'return !id(light_busy);'
          then:
            - globals.set:
                id: syncing_from_sensor
                value: 'true'
            - globals.set:
                id: light_target
                value: !lambda 'return id(led_status).state;'
            - if:
                condition:
                  binary_sensor.is_on: led_status
                then:
                  - light.turn_on: light_led
                else:
                  - light.turn_off: light_led
            - delay: 500ms
            - globals.set:
                id: syncing_from_sensor
                value: 'false'

####################################################################################################
# Buttons

button:
  - platform: template
    name: Fan Up
    icon: "mdi:plus"
    on_press:
      - script.execute: { id: send_up }

  - platform: template
    name: Fan Down
    icon: "mdi:minus"
    on_press:
      - script.execute: { id: send_down }

####################################################################################################
#  Light

light:
  - platform: binary
    name: "Licht"
    id: light_led
    output: light_output
    restore_mode: ALWAYS_OFF

output:
  - platform: template
    id: light_output
    type: binary
    write_action:
      - if:
          condition:
            lambda: 'return !id(syncing_from_sensor);'
          then:
            - globals.set:
                id: light_target
                value: !lambda 'return state;'
            - if:
                condition:
                  lambda: 'return !id(light_busy);'
                then:
                  - script.execute: { id: apply_light }
esphome:
  name: bewasserungscomputer
  friendly_name: Bewässerungscomputer

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Bewässerungscomputer Hotspot"
    password: "0Aht0PfqaXeu"

captive_portal:

web_server:
  port: 80

api:
  encryption:
    key: "O/46qSOxukvTvuq3AIrwGOnEcdYFXVqz4eE/2J3uEp0="

ota:
  - platform: esphome
    password: "00ce8b7eb7fa40f5dccd9656e6b5b498"

switch:
  - platform: gpio
    pin: GPIO32
    name: "Valve 1"
    id: valve_1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 3600s
      - switch.turn_off: valve_1

  - platform: gpio
    pin: GPIO33
    name: "Valve 2"
    id: valve_2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 3600s
      - switch.turn_off: valve_1

  - platform: gpio
    pin: GPIO25
    name: "Valve 3"
    id: valve_3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 3600s
      - switch.turn_off: valve_1

  - platform: gpio
    pin: GPIO26
    name: "Valve 4"
    id: valve_4
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 3600s
      - switch.turn_off: valve_1


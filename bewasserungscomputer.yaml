sensor:
  - platform: wifi_signal  # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy  # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"

sprinkler:
  - id: garden_sprinkler_ctrlr
    main_switch: "Garten Sprinkler"
    auto_advance_switch: "Garten Sprinkler Auto Advance"
    # reverse_switch: "Garten Sprinkler Reverse"
    # multiplier_number: "Garten Sprinkler Multiplier"
    # repeat_number: "Garten Sprinkler Repeat"
    valve_overlap: 1s
    valves:
      - valve_switch: "Rasen"
        enable_switch: "Aktiviere Rasen"
        run_duration_number: "Rasen Laufzeit"
        valve_switch_id: valve_1
      - valve_switch: "Haus"
        enable_switch: "Aktiviere Haus"
        run_duration_number: "Haus Laufzeit"
        valve_switch_id: valve_2
      - valve_switch: "Hecke"
        enable_switch: "Aktiviere Hecke"
        run_duration_number: "Hecke Laufzeit"
        valve_switch_id: valve_3
      - valve_switch: "Reserve"
        enable_switch: "Aktiviere Reserve"
        run_duration_number: "Reserves Laufzeit"
        valve_switch_id: valve_4

button:
  - platform: restart
    name: "Neu starten"

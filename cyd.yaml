# Device: Guition ESP32-2432S028 (CYD / "Cheap Yellow Display"), USB-C variant
# MCU: ESP32-WROOM-32 (no PSRAM), 2.8" 320x240 TFT (ILI9341 over HSPI),
# backlight on GPIO21, touch controller on a separate SPI bus (not wired up here).
esphome:
  name: cyd
  friendly_name: CYD

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

http_request:
  verify_ssl: false
  timeout: 10s

spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12

switch:
  - platform: gpio
    pin: GPIO21
    id: back_light
    name: "Display Backlight"
    restore_mode: ALWAYS_ON

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "sTW3VxDjklU2MEXw1M/xlmy2VqIq4Ow0wIC8TXHMK9c="

ota:
  - platform: esphome
    password: "e88f0ec8f2e4d09ef6d4e695ce3c6e7e"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - lambda: 'id(status_text) = "Loading...";'
    - component.update: tft_display
    - component.update: remote_pic

  # Fallback hotspot in case wifi connection fails. No captive portal —
  # to change networks, reflash over USB with new credentials.
  ap:
    ssid: "Cyd Fallback Hotspot"
    password: "zC4f2YlDK4V4"

globals:
  - id: status_text
    type: std::string
    restore_value: no
    initial_value: '"Loading..."'
  - id: image_ready
    type: bool
    restore_value: no
    initial_value: 'false'

font:
  - file: "gfonts://Roboto"
    id: overlay_font
    size: 20

button:
  - platform: template
    name: "Refresh image"
    id: refresh_image
    icon: mdi:refresh
    on_press:
      - lambda: 'id(status_text) = "Loading...";'
      - component.update: tft_display
      - component.update: remote_pic

text_sensor:
  - platform: homeassistant
    id: display_image_url
    entity_id: input_text.display_image_url
    on_value:
      then:
        - lambda: 'id(status_text) = "Loading...";'
        - component.update: tft_display
        - if:
            condition:
              lambda: 'return x.length() > 0;'
            then:
              - online_image.set_url:
                  id: remote_pic
                  url: !lambda 'return x;'
                  update: true
            else:
              - online_image.set_url:
                  id: remote_pic
                  url: "https://picsum.photos/seed/cyd/240/180"
                  update: true

online_image:
  - id: remote_pic
    url: "https://picsum.photos/seed/cyd/240/180"
    format: JPEG
    # GRAYSCALE matches the display's 8-bit palette and halves the image
    # buffer from 150 KB to 75 KB. Required on ESP32-WROOM (no PSRAM).
    type: GRAYSCALE
    resize: 240x180
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            id(image_ready) = true;
            id(status_text) = "";
        - component.update: tft_display
    on_error:
      then:
        - lambda: 'id(status_text) = "Error: image failed to load";'
        - component.update: tft_display

display:
  - platform: ili9xxx
    id: tft_display
    model: ILI9341
    spi_id: tft_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    rotation: 90
    update_interval: never
    invert_colors: false
    # 8-bit grayscale palette: framebuffer = 75 KB instead of 150 KB.
    # Required on ESP32-WROOM (no PSRAM) — full 16-bit won't fit alongside
    # WiFi + the online_image buffer.
    color_palette: GRAYSCALE
    lambda: |-
      it.fill(Color::BLACK);
      if (id(image_ready)) {
        const int img_w = id(remote_pic).get_width();
        const int img_h = id(remote_pic).get_height();
        const int x = (it.get_width() - img_w) / 2;
        const int y = (it.get_height() - img_h) / 2;
        it.image(x, y, id(remote_pic));
      }
      if (!id(status_text).empty()) {
        const int bar_h = 32;
        const int y = it.get_height() / 2 - bar_h / 2;
        it.filled_rectangle(0, y, it.get_width(), bar_h, Color(0, 0, 0));
        it.print(it.get_width() / 2, y + bar_h / 2, id(overlay_font),
                 Color(255, 255, 255), TextAlign::CENTER,
                 id(status_text).c_str());
      }